<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kin Cafe - Cash Change Tests</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 16px; }
        .pass { color: #1F6B45; }
        .fail { color: #B54747; }
        code { background: #f5f5f5; padding: 2px 6px; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Cash Change Unit Tests</h1>
    <div id="out"></div>

    <script src="../assets/js/cash-change.js"></script>
    <script>
        const out = document.getElementById('out');
        const results = [];

        function assertEqual(actual, expected, name) {
            const ok = Object.is(actual, expected);
            results.push({ ok, name, actual, expected });
        }

        function run() {
            const cc = window.KinCashChange;
            assertEqual(cc.parseMoneyInput(null), 0, 'null input => 0');
            assertEqual(cc.parseMoneyInput(''), 0, 'empty string => 0');
            assertEqual(cc.parseMoneyInput(' 200 '), 200, 'trim numeric string');
            assertEqual(cc.parseMoneyInput('₱1,234.50'), 1234.5, 'currency string with comma');
            assertEqual(cc.parseMoneyInput('100,50'), 100.5, 'comma decimal input');
            assertEqual(cc.parseMoneyInput('abc'), 0, 'non-numeric => 0');
            assertEqual(cc.roundToCents(0.105), 0.11, 'rounding to cents');
            assertEqual(cc.computeChange(119, 200), 81, 'basic change');
            assertEqual(cc.computeChange(119, 119), 0, 'exact change');
            assertEqual(cc.computeChange(119, 0), 0, 'insufficient cash => 0 change');
            assertEqual(cc.computeChange(119, -50), 0, 'negative paid treated as 0');
            assertEqual(cc.computeChange(-10, 5), 5, 'negative total treated as 0');

            const breakdown = cc.computeDenominationBreakdown(81, [50, 20, 10, 1]);
            assertEqual(JSON.stringify(breakdown), JSON.stringify([{denom:50,count:1},{denom:20,count:1},{denom:10,count:1},{denom:1,count:1}]), 'denomination breakdown');
        }

        run();

        const passCount = results.filter(r => r.ok).length;
        const failCount = results.length - passCount;
        out.innerHTML = `<p><strong>${passCount}</strong> passed, <strong>${failCount}</strong> failed.</p>` +
            '<ul>' + results.map(r => {
                const cls = r.ok ? 'pass' : 'fail';
                const detail = r.ok ? '' : ` (expected <code>${r.expected}</code> got <code>${r.actual}</code>)`;
                return `<li class="${cls}">${r.ok ? 'PASS' : 'FAIL'}: ${r.name}${detail}</li>`;
            }).join('') + '</ul>';
    </script>
</body>
</html>
